非常感谢大家对于《鸣潮》的关注！在《鸣潮》上线后，对于众多玩家反馈的游戏运行性能问题，如卡顿、卡死、掉帧、发热、画面模糊、游戏崩溃和闪退等情况，目前项目组正在积极排查问题，并已在处理中。

由于性能问题带来的体验不佳，项目组在此向所有关心《鸣潮》的漂泊者郑重道歉。很抱歉在第一次正式和大家见面的时候，没能带来更好的游戏体验，也给所有期待着《鸣潮》的漂泊者带来了不必要的困扰，让大家失望了。

与此同时，我们决定针对上述问题导致的体验不佳，在5月24日6:00（UTC+8）向全体漂泊者发放补偿：唤声涡纹*10。

此外，项目组已经在第一时间针对大家反馈较多的紧急问题进行更新修复（如无法登录、短时间内发热过烫等），优先保障游戏过程中的稳定性。对于当前版本，如在游戏过程中设备出现发热严重、崩溃现象严重等情况，项目组建议通过【设置】-【图像】确认当前设备负载状态。如出现过载状态时，建议调整图像设置，以获得更流畅的体验。

最后，还有一件事我们希望传达给各位漂泊者：性能问题一直以来都是《鸣潮》项目组持续攻坚的命题。后续我们将通过持续的线上更新，尽可能改善大家的游戏体验。具体调整进度也将通过《研发终端日志》，与大家同步与说明。

由此带来的体验不佳，我们再次深表歉意，也再次感谢所有漂泊者对于《鸣潮》一直以来的关注与支持！

✦补偿内容：唤声涡纹*10
✦领取条件：7月3日03:59（UTC+8）前完成创角，且联觉等级≥2级的玩家

《鸣潮》项目组`,rewards:{lustrous:10},source:"TapTap 官方 2024-05-24「关于性能问题及持续优化的公告说明」ID:429475503 · 唤声涡纹*10"},{id:"mail_1_0_official_apology_0525",date:"2024-05-24",category:"apology",title:"关于游戏体验问题及持续优化的公告说明",body:`亲爱的漂泊者：

在《鸣潮》上线后，关于众多漂泊者反映的游戏体验相关问题，非常抱歉没有给大家带来更好的游戏体验。我们将在近期通过游戏更新，优化游戏内容体验不佳的问题。同时为了表达项目组的歉意，我们将在5月25日10:00（UTC+8）向全体漂泊者额外发放补偿：浮金波纹*10。

✦补偿内容：浮金波纹*10
✦领取条件：7月3日03:59（UTC+8）前完成创角，且联觉等级≥2级的玩家

除了当前正在进行中的性能问题优化，关于游戏内容，具体调整内容及后续重点开发方向如下：

（一）优化跳过功能
针对目前漂泊者反馈的“剧情跳过范围少、跳过按钮展示不明确、主线内容冗长”等问题进行调整。优化方向：支持全量剧情跳过，同时也支持剧情文本及过场演出的记录回溯。包括如下内容：
1. 修改【跳过】按钮展示图标；
2. 大幅度增加主线剧情的跳过范围，包括序章及第一幕剧情的跳过；
3. 支持站桩对话的跳过；
4. 近期内开放共鸣者【吟霖】伴星任务。
由于技术性原因限制，剧情中的过场演出暂时无法实装跳过功能。由此带来的不便，感谢漂泊者的理解！

（二）优化战斗体验
针对战斗过程中，漂泊者反馈较多的打击感不佳、受击反馈弱、手柄模式体验不佳、战斗过程中的视野遮挡等问题，项目组将结合不同战斗场景进行专项优化，目标是尽可能提升战斗过程的正向反馈。同时手柄功能优化、按键自定义开放条件过晚等问题已在同步改善中。

（三）感谢漂泊者的支持，追加自选常驻5星角色答谢礼
在公测后，我们从各个社区和平台收到了大量关于【新手唤取活动】的反馈。对于活动过程中造成的体验不佳我们深表歉意。因此，我们将在5月26日10:00（UTC+8），通过邮件向全体漂泊者发放特别道具【潮声答谢券】，使用后可获得1位自选常驻5星角色，该活动有效期至2025年5月22日11:59（UTC+8）前。详细活动规则，请后续前往游戏内公告查看。

（四）更多优化内容、更多版本内容持续开发中
后续我们将优化游戏内容，更多功能及玩法活动也在持续开发中。例如：优化部分NPC美术资源、增加分层地图功能、更多声骸变身玩法……等等内容，也在持续开发当中。

我们深知现在的《鸣潮》仍有许多不足，后续我们将持续打磨游戏内容及游戏体验。再次感谢所有漂泊者对于《鸣潮》的关注与支持！

✦领取条件：解锁【邮件】功能，领取时间至2024年6月28日05:59（UTC+8）

《鸣潮》项目组`,rewards:{radiant:10,forging:5,crystal_solvent:20},source:"TapTap 2024-06-02 致歉公告 + Fandom Mail/Official Apologies (2024-06-03) 三附件合一"},{id:"mail_1_0_echo_shell_extra",date:"2024-06-06",category:"apology",expiresOn:"2024-07-03",title:"关于声骸回收问题处理的追加补偿",body:`亲爱的漂泊者：

2024年5月29日，通过玩家反馈我们发现了“回收已培养声骸时，出现贝币异常产出”线上BUG。因该问题将影响玩家获取贝币的公平性，当晚我们通过线上紧急更新修复了该问题，并向全服发放补偿。

为尽可能减少不公平，我们仓促决定在发放补偿后，14个工作日内扣除受BUG影响的部分漂泊者所获得的额外贝币产出，并将处理方式通过邮件向大家进行说明。由于修复较为紧急，我们未能在第一时间进行已知问题公告，给大家造成了困扰。

在此，项目组向大家致以诚挚的歉意。

以“通过此BUG产出的额外贝币数量最大值”作为基准，数量向上最大取整，向全体漂泊者追加补偿：贝币*1000000。

e="color:var(--text)">普攻</b>变成<b>枪扫风定·强化连段</b>（伤害 ×2）。',星域:'<b style="color:var(--gold)">星域</b>（守岸人专属领域）<br>展开 <b>3</b> 回合（1 链 <b>5</b> 回合 + 切人不消散）<br>· 全队每回合回血<br>· 全队暴击率 +20% · 暴击伤害 +30%<br>· 2 链：星域内全队攻击 +40%',审判值:'<b style="color:#7bd6ff">审判值</b>（吟霖共鸣回路 0-100）<br>普攻 +<b>15</b> · 共鸣技能 +<b>30</b> · 命中印记目标额外 +<b>5</b>（2 链）。<br>积满 100 自动触发<b style="color:var(--gold)">审判之雷</b>。',审判印记:'<b style="color:var(--gold)">审判印记</b>（吟霖标记 · 挂在敌人身上）<br>持续 <b>3</b> 回合，最多 <b>3</b> 层。<br>· 吟霖技能/解放命中即叠 1 层；解放命中主目标必挂 1 层<br>· <b>3 链</b>：印记每层使目标受到伤害 +<b>10%</b>（全队全伤害类型生效）<br>· <b>1 链</b>：吟霖技能/解放对印记目标 <b>×1.7</b>；<b>5 链</b>：解放对印记目标再 <b>×1.5</b>',审判之雷:'<b style="color:var(--gold)">审判之雷</b>（吟霖触发机制）<br>审判值满 100 时自动触发：<br>· 给当前主目标挂 <b>1</b> 层<b style="color:var(--gold)">审判印记</b><br>· <b>4 链</b>：触发瞬间全队攻击 +<b>15%</b>，持续 <b>2</b> 回合',疾霆昭彰:'<b style="color:var(--accent)">疾霆昭彰</b>（吟霖 6 链 · 解放后开启 2 回合）<br>期间，吟霖<b style="color:var(--text)">普攻</b>命中带<b style="color:var(--gold)">审判印记</b>的目标时，额外触发一次：<br>· 攻击 × <b>70%</b> 导电伤害（视为共鸣技能伤害，享受 1 链 ×1.7）<br>· 每回合最多触发 <b>1</b> 次',离火:'<b style="color:#ff8c5e">离火</b>（长离共鸣回路 · 0-6 层）<br>普攻/技能/重击各 +1 / 解放 +3。<br>每持有 <b>1</b> 层，<b style="color:#ff8c5e">热熔伤害 +5%</b>（满 6 层 +30%），随层数实时变化。<br>攒满 <b>6</b> 层进入<b style="color:#ff8c5e">心眼模式</b>。',心眼模式:'<b style="color:#ff8c5e">心眼模式</b>（长离 · 满 6 层离火进入）<br>三个攻击键变身、倍率与伤害类型一起拔高：<br>· 普攻→<b>心眼·征</b>：攻击 × 180% 共鸣技能伤害（平时 100% 普攻）<br>· 技能→<b>心眼·劫</b>：攻击 × 200% 共鸣技能伤害，不吃冷却<br>· 重击→<b>心眼·冲</b>：攻击 × 400% 共鸣技能伤害（爆发顶点）<br>出招优先用离火抵 AP：<b>每 2 层离火 = 1 点 AP</b>，缺口用回合 AP 补。<br>离火 &lt; 2 层时退出，三招还原。',焰羽:'<b style="color:#ff8c5e">焰羽</b>（长离 · 共鸣解放后 2 回合）<br>攻击力 +<b>50%</b>，攻击无视目标 <b>40%</b> 防御。<br>与心眼模式独立，可叠加。',韶光:'<b style="color:#7bd6ff">韶光</b>（今汐共鸣回路 · 0-100）<br>普攻 +10 / 共鸣技能 +20 / 变奏入场 +50。<br>满 100 时下次<b style="color:var(--accent)">共鸣技能</b>替换为<b style="color:var(--gold)">惊龙破空</b>，配合<b style="color:#7bd6ff">惊蛰</b>（4 层）消耗，伤害大幅放大。',惊蛰:'<b style="color:#7bd6ff">惊蛰</b>（今汐战斗状态 · 0-4 层）<br>普攻 +1 / 共鸣技能 +1。<br><b style="color:var(--gold)">惊龙破空</b  <b>1</b> 回合时清除',行气反击:'<b style="color:var(--accent)">行气反击</b>（鉴心派生技能 · 架势后触发）<br>处于<b>架势</b>状态时，下次施放<b style="color:var(--accent)">共鸣技能</b>会变为<b>行气反击</b>。<br>· 高倍率气动伤害<br>· 6 链：在重击·混元气旋期间可施放<b>特殊行气反击</b>（atk × <b>557%</b> 重击类型）',迷失羔羊:'<b style="color:#a78bff">迷失羔羊</b>（安可 6 链 buff · 0-5 层）<br><b style="color:var(--burst)">共鸣解放·黑咩大暴走</b>期间，每次造成伤害自身叠 <b>1</b> 层，每层使攻击 +<b>5%</b>，最多 <b>5</b> 层（满层 +25% 攻击）。',空中攻击:'<b style="color:#ff8c5e">空中攻击</b>（部分角色机制）<br>跳跃 / 腾空后的派生攻击。战斗中按<b style="color:#ff8c5e">重击</b>类型结算，享受重击伤害加成。典型代表：卡提希娅、布兰特、秧秧。',空中攻击空翻:'<b style="color:#ff8c5e">空中攻击空翻</b>（布兰特机制）<br>布兰特在空中做空翻，是其核心爆发段。每次空翻给布兰特<b style="color:#ff8c5e">"跟随洋流和信风"</b> +1 层伤害提升（1 链）。战斗中按<b style="color:#ff8c5e">重击</b>类型结算。',空中释羽:'<b style="color:#ff8c5e">空中释羽</b>（秧秧标志性输出段）<br>秧秧跳跃后释放羽箭群的派生<b style="color:#ff8c5e">重击</b>。是秧秧的主要爆发段。<br>· 4 链：空中释羽伤害 +<b>95%</b><br>· 6 链：施放后全队攻击 +<b>20%</b>，持续 4 回合',闪避反击:'<b style="color:var(--green)">闪避反击</b>（部分角色机制）<br>成功闪避后立刻反击的派生动作。战斗中视作变奏类派生，通常用于触发角色的反击/追击效果。',"强化·前扑":'<b style="color:var(--accent)">强化·前扑</b>（灯灯派生）<br>灯灯特定条件下普攻强化为前扑，向目标突进。<br>· 2 链：前扑攻击无视 <b>20%</b> 防御',"强化·后撤":'<b style="color:var(--accent)">强化·后撤</b>（灯灯派生）<br>灯灯特定条件下普攻强化为后撤，拉远距离同时攻击。<br>· 1 链：后撤后 <b>1</b> 回合内回复 <b>60%</b> 耐力<br>· 2 链：后撤攻击无视 <b>20%</b> 防御',牵引:'<b style="color:var(--green)">牵引</b>（控场效果）<br>把附近敌人拉到一起，方便范围伤害命中更多目标。战斗中表现为聚怪效果，提高 AOE 技能的命中价值。典型代表：秧秧·风场鸣声、菲比·镜之环。',风场鸣声:'<b style="color:var(--accent)">风场鸣声</b>（秧秧共鸣技能）<br>召唤气动风场，<b>牵引</b>范围内敌人到一起。<br>· 3 链：风场牵引范围 +<b>33%</b>',停滞:'<b style="color:var(--gold)">停滞</b>（控制效果）<br>使目标短暂无法行动的状态，类似"冻结"但只锁动作不锁伤害。<br>触发：珂莱塔·焕彩、菲比·镜之环、坎特蕾拉·迷梦、布兰特·火焰归亡曲等。',嘲讽:'<b style="color:var(--green)">嘲讽</b>（仇恨控制）<br>使敌人优先攻击指定目标，保护队伍中的输出角色。典型代表：秋水·雾化分身。',协同攻击:'<b style="color:var(--accent)">协同攻击</b>（召唤物/链接攻击）<br>角色下场后由召唤物/连接物触发的攻击，享受当前角色的攻击/暴击。<br>典型代表：折枝·墨鹤追击、莫特斐·浮翼狂想协同、维里奈 6 链协同。',再燃:'<b style="color:#ff8c5e">再燃</b>（布兰特解放 6 链派生）<br>施放<b style="color:var(--burst)">火焰归亡曲</b>后在原地产生一次<b style="color:#ff8c5e">再燃</b>爆炸，造成火焰归亡曲 <b>30%</b> 的伤害，此次伤害为<b style="color:var(--text)">普攻</b>类型。',猎杀影:'<b style="color:#7bd6ff">猎杀影</b>（卡卡罗 6 链召唤物）<br><b style="color:var(--gold)">Deathblade</b> 形态下，每次<b style="color:#ff8c5e">重击·死告</b>召唤 <b>2</b> 个猎杀影协同攻击，每个造成 atk × <b>100%</b> 导电伤害，视为<b style="color:var(--burst)">共鸣解放</b>类型。',白鹤:'<b style="color:#7bd6ff">白鹤</b>（折枝 6 链召唤物）<br>施放<b style="color:var(--accent)">共鸣技能·以形写神</b>命中时，额外召唤 <b>1</b> 只白鹤，造成折枝 atk × 120% 冷凝伤害（共鸣技能伤害类型）。白鹤独立结算，不计入<b class="term-resource">墨鹤</b>计数。',衍构模体:'<b style="color:#7bd6ff">衍构模体</b>（相里要 1 链召唤物）<br>施放<b style="color:var(--accent)">共鸣技能·万方法则</b>时，额外生成 <b>6</b> 个衍构模体攻击目标，每个伤害倍率为万方法则的 <b>8%</b>，此次伤害视为<b style="color:var(--burst)">共鸣解放</b>类型。',织梦水母:'<b style="color:#7bd6ff">织梦水母</b>（坎特蕾拉 5 链召唤物）<br><b style="color:var(--burst)">共鸣解放·弥漫</b>召唤的水母群。每只持续协同攻击。<br>· 5 链：最大召唤数 +<b>5</b>',雷之楔:'<b style="color:var(--accent)">雷之楔</b>（渊武召唤物）<br>渊武<b style="color:var(--accent)">共鸣技能·雷之楔</b>召唤的雷电协同武器，存在期间持续协同攻击。<br>· 3 链：命中按渊武 20% 防御额外加伤<br>· 5 链：雷之楔在场时渊武解放 +<b>50%</b>',镜之环:'<b style="color:var(--accent)">镜之环</b>（菲比召唤区域）<br><b style="color:var(--accent)">共鸣技能·FFF</b>召唤；持续期间对进入的目标附加<b class="term-resource">光噪效应</b> + <b>停滞</b>效果（最多 12 个目标，每个 1 次）。',解离:'<b style="color:#7bd6ff">解离</b>（珂莱塔特性）<br>珂莱塔技能给目标附加的冷凝易伤标记。命中解离目标时，珂莱塔可获得额外灵萃。<br>· 1 链：对解离目标暴击 +<b>12.5%</b>',变彩:'<b style="color:#7bd6ff">变彩</b>（珂莱塔 1 链状态）<br>珂莱塔对解离目标施加的进阶状态，命中变彩目标时<b style="color:var(--accent)">共鸣技能·示我璀璨</b>额外回 30 灵萃。',虚实之门:'<b style="color:var(--green)">虚实之门</b>（秋水召唤区域）<br>秋水<b style="color:var(--accent)">共鸣技能·移位戏法</b>召唤的传送门，配合<b class="term-resource">雾化分身</b>。<br>· 3 链：普攻穿过虚实之门额外生成 <b>2</b> 颗子弹<br>· 6 链：重击穿过虚实之门伤害额外 +<b>50%</b>',迷雾潜行:'<b style="color:var(--green)">迷雾潜行</b>（秋水战斗状态）<br>秋水进入隐身潜行状态。<br>· 4 链：潜行期间受到的伤害 -<b>30%</b><br>· 5 链：潜行期间秋水气动伤害加成 +<b>25%</b>',阴阳相生:'<b style="color:#7bd6ff">阴阳相生</b>（卜灵战斗状态）<br>卜灵<b style="color:var(--accent)">共鸣技能·五雷荡煞阵</b>触发的双形态平衡态。<br>· 2 链：进入阴阳相生时回 <b>25</b> 共鸣能量',五雷荡煞阵:'<b style="color:var(--gold)">五雷荡煞阵</b>（卜灵共鸣技能）<br>召唤雷阵覆盖战场，对范围内敌人附加<b>电磁效应</b> + 全队治疗。<br>· 3        #roles/#paneStat/#paneEx/#paneLog/#sTotal 等所有 id 在 mount 后不复存在，
       请勿通过 getElementById 查询这些节点。 -->
  <div class="view" id="viewGacha">
    <!-- 上：卡池 + 抽卡 -->
    <div class="section-top">
      <div class="banner-wrap">
        <div class="banner-tabs" id="bnTabs"></div>
        <div class="banner-art" id="bnArt"></div>
      </div>

      <div class="pull-card">
        <div class="cost-panel" id="costPanel"></div>
        <div class="pity-row" id="pityRow"></div>
        <div class="pull-btns">
          <button class="pbtn" id="pull1"><span class="big">唤取</span><span class="small" id="lbl1">× 1</span></button>
          <button class="pbtn" id="pull10"><span class="big">十连唤取</span><span class="small" id="lbl10">× 10</span></button>
        </div>
        <div class="pull-extras">
          <button class="xbtn" id="toFive">抽到下个五星</button>
          <button class="xbtn" id="free10">试手十连</button>
        </div>
      </div>
    </div>

    <!-- 下：左角色 + 右侧栏 tab（统计 / 海市 / 记录） -->
    <div class="section-bot">
      <div class="col">
        <div class="col-wrap">
          <h2 class="col-head">角 色 与 共 鸣 链</h2>
          <div class="roles" id="roles"></div>
        </div>
      </div>

      <div class="col">
        <div class="col-wrap">
          <div class="side-tabs">
            <div class="s-tab on" data-s="stat">统 计</div>
            <div class="s-tab" data-s="ex">海 市</div>
            <div class="s-tab" data-s="log">记 录</div>
          </div>

          <div class="pane" id="paneStat">
            <div class="stats">
              <div class="stat"><b id="sTotal">0</b><span>总抽数</span></div>
              <div class="stat"><b id="sFive">0</b><span>五星</span></div>
              <div class="stat"><b id="sFour">0</b><span>四星</span></div>
              <div class="stat"><b id="sAvg">-</b><span>出金均值</span></div>
              <div class="stat"><b id="sUp">0</b><span>提升命中</span></div>
              <div class="stat"><b id="sWave">0</b><span>波段持有</span></div>
              <div class="stat"><b id="sCharPity">0</b><span>角色垫</span></div>
              <div class="stat"><b id="sWeapPity">0</b><span>武器垫</span></div>
              <div class="stat"><b id="sRoles">0</b><span>已拥角色</span></div>
              <div class="stat"><b id="sWeapons">0</b><span>已拥武器</span></div>
            </div>
            <div id="sCollectionDetail" style="margin-top:10px;font-size:11px;color:var(--muted);text-align:center;letter-spacing:.5px"></div>
          </div>

          <div class="pane" id="paneEx" style="display:none">
            <h2 class="col-head" style="margin-top:0">海 市 珊 瑚</h2>
            <div class="coral-bar">
              <div class="coral"><div class="l">余 波 珊 瑚</div><div class="v" id="cAg">0</div>
                <div class="h" id="cAgHint">可换 0 抽</div></div>
              <div class="coral osc"><div class="l">残 振 珊 瑚</div><div class="v" id="cOs">0</div>
                <div class="h" id="cOsHint">可换 0 抽</div></div>
            </div>
            <h2 class="col-head" style="margin-top:14px">波 纹 兑 换</h2>
            <div class="exch-list" id="exList"></div>
            <h2 class="col-head" style="margin-top:14px">角 色 波 段</h2>
            <div class="exch-list" id="waveList"></div>
          </div>

          <div class="pane" id="paneLog" style="display:none">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <span style="font-size:11px;color:var(--muted);letter-spacing:1px">最近 200 条</span>
              <button class="mbtn" id="clearLog">清空</button>
            </div>
            <div class="log" id="logList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 视图 2：冒险 ====== -->
  <div class="view" id="viewAdventure" style="display:none">
    <div class="col-wrap">
      <div class="side-tabs">
        <div class="a-tab on" data-a="team">编 队</div>
        <div class="a-tab" data-a="daily">日 常</div>
        <div class="a-tab" data-a="dungeon">副 本</div>
        <div class="a-tab" data-a="abyss">深 塔</div>
        <div class="a-tab" data-a="wastes">海 墟</div>
      </div>
      <div class="pane" id="paneTeam"></div>
      <div class="pane" id="paneDaily" style="display:none"></div>
      <div class="pane" id="paneDungeon" style="display:none"></div>
      <div class="pane" id="paneAbyss" style="display:none"></div>
      <div class="pane" id="paneWastes" style="display:none"></div>
    </div>
  </div>

  <!-- ====== 视图 3：背包（独立顶层 tab）====== -->
  <div class="view" id="viewBag" style="display:none">
    <div class="col-wrap">
      <div id="paneBag"></div>
    </div>
  </div>

  <!-- ====== 视图 4：商店 ====== -->
  <div class="view" id="viewStorage" style="display:none">
    <div class="col-wrap">
      <div class="side-tabs">
        <div class="b-tab on" data-b="podcast">电 台</div>
        <div class="b-tab" data-b="shop">商 店</div>
      </div>
      <div class="pane" id="panePodcast"></div>
      <!-- #paneShop 内部静态结构由 preact <ShopPanel/> 接管（Stage 6.1b），mount 时清空重建。
           内部 #kSpent/#kLunite/#kDays/#scFeatured/#scRegular/#scTopup/#bannerFeatured 等id
           在 mount 后不复存在，请勿通过 getElementById 查询。 -->
      <div class="pane" id="paneShop" style="display:none">
        <h2 class="col-head" style="margin-top:0">钱 包</h2>
        <div class="shop-bar">
          <div class="sb spent"><div class="l">累计充值</div><div class="v" id="kSpent">¥0</div></div>
          <div class="sb lun"><div class="l">月相库存</div><div class="v" id="kLunite">0</div></div>
          <div class="sb days"><div class="l">月卡剩余</div><div class="v" id="kDays">0</div></div>
        </div>

        <!-- 商店分类 tab -->
        <div class="shop-cat-tabs">
          <button class="sct on" data-sc="featured">特惠专区</button>
          <button class="sct" data-sc="regular">常驻礼包</button>
          <button class="sct" data-sc="topup">凝刻月相</button>
        </div>

        <!-- 特惠专区：月卡 + 战令 + 限购礼包 -->
        <div class="shop-cat" id="scFeatured">
          <div class="shop-banners" id="bannerFeatured"></div>
        </div>

        <!-- 常驻礼包：长期不下架的礼包（暂时也是 bundle 里的，按 period 区分） -->
        <div class="shop-cat" id="scRegular" style="display:none">
          <div class="shop-banners" id="bannerRegular"></div>
        </div>

        <!-- 凝刻月相（直充） -->
        <div class="shop-cat" id="scTopup" style="display:none">
          <div class="shop-banners topup-grid" id="bannerTopup"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 全局 toast -->
  <div class="toast" id="toast"></div>
</div>

<!-- 抽卡动画 -->
<div class="overlay" id="ov">
  <div class="ov-title" id="ovTitle"></div>
  <div class="beam" id="beam"></div>
  <div class="sparks" id="sparks"></div>
  <div class="cards-wrap" id="cards"></div>
</div>
<div class="skip-hint" id="skipHint">点击屏幕翻开所有 · 再次点击关闭</div>

<!-- 角色详情弹窗（外层，独立 mount 节点，避免与子 modal 共用 #modalBox）-->
<div class="modal" id="roleModal">
  <div class="modal-box role-modal" id="roleModalBox"></div>
</div>
<!-- 通用弹窗（子 modal，DOM 在后故层级在上）-->
<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- 战斗界面（全屏覆盖） -->
<div id="battleOverlay" style="display:none;position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);align-items:flex-start;justify-content:center;overflow-y:auto"></div>

<!-- Preact 根挂载点 (Stage 1 起,新 UI 组件挂这里;暂时是空的) -->
<div id="preact-root"></div>

</body>
</html>
