:var(--gold)">暴力美学</b>强化。',决意:'<b style="color:var(--gold)">决意</b>（卡提希娅专属资源 · 上限 3 层）<br>普攻/重击/共鸣技能命中时获得 <b>1</b> 层（持续 2 回合，获得新决意时刷新全部持续时间）。<br>每层：自身<b class="term-normal">气动伤害</b> +<b>10%</b>。消耗全部层数进入芙露德莉斯形态。',人权:'<b style="color:#6bb5ff">人权</b>（卡提希娅形态之力 · 消耗 1 层决意获得）<br>芙露德莉斯形态下防御力增强，受到伤害 <b>-30%</b>。',神权:'<b style="color:var(--gold)">神权</b>（卡提希娅形态之力 · 消耗 2 层决意获得）<br>芙露德莉斯形态下暴击率 <b>+25%</b>。',异权:'<b style="color:#ff6b9d">异权</b>（卡提希娅形态之力 · 消耗 3 层决意获得）<br>芙露德莉斯形态下，非大招技能（普攻/重击/共鸣技能）叠加 <b>2 层</b>风蚀效应（取代 1 层）。',听骑士从心祈愿:'<b style="color:var(--gold)">共鸣解放·听骑士从心祈愿</b>（卡提希娅第一次解放 · 3 AP）<br>消耗全部【决意】层数，根据消耗层数获得人权/神权/异权，进入<b style="color:#a78bff">芙露德莉斯形态</b>。<br>此技能无直接伤害。',看潮怒风哮之刃:'<b style="color:#ff6b9d">共鸣解放·看潮怒风哮之刃</b>（卡提希娅第二次解放 · 3 AP · 需芙露德莉斯形态中）<br>基于生命值 × 46.2% + 每层<b style="color:var(--green)">风蚀效应</b> +20% 伤害。<br>施放后清空全部风蚀并退出芙露德莉斯形态。6 链时层数翻倍、不清空。',风蚀效应:'<b style="color:var(--green)">风蚀效应</b>（气动属性效应 · 可叠层 DoT）<br>部分气动角色的技能可为敌人附加。<br>敌人回合开始时造成伤害 = 敌人攻击力 × 层数 × <b>0.3</b>。<br>芙露德莉斯形态第二次解放·看潮怒风哮之刃：每层 <b>+20%</b> 伤害，施放后清空全部风蚀。',芙露德莉斯:'<b style="color:#a78bff">芙露德莉斯形态</b>（卡提希娅解放强化 · 持续 3 回合）<br>进入方式：共鸣解放·听骑士从心祈愿（消耗全部【决意】层数）<br>· 每次攻击/技能给目标附加 <b>1</b> 层风蚀效应（异权：<b>2</b> 层）<br>· 命中额外回复 <b>+8</b> 共鸣能量<br>· 再次释放共鸣解放 → 看潮怒风哮之刃：风蚀爆发终结<br>形态结束时清除人权/神权/异权状态。',余火:'<b style="color:#ff8c5e">余火</b>（嘉贝莉娜共鸣回路 · 0-10 点）<br>每 1 点给 8% 暴击伤害（1 链）、3.5% 热熔加深（6 链）。<b style="color:var(--burst)">共鸣解放·永恒位格</b>开启强化形态。',永恒位格:'<b style="color:var(--gold)">永恒位格</b>（嘉贝莉娜解放强化 · 持续战斗剩余时间）<br>进入方式：释放<b style="color:var(--burst)">共鸣解放·永恒位格</b>触发。<br>· 6 链：自身全伤害 +<b>60%</b>，余火满层热熔加深 +<b>35%</b><br>· 4 链：共鸣解放后全队伤害 +<b>20%</b><br>· 是嘉贝莉娜的主输出窗口，配合重击·炼羽裁决',杀意:'<b style="color:var(--gold)">杀意</b>（卡卡罗解放强化）<br><b style="color:var(--burst)">共鸣解放·杀戮武装</b>开启<b style="color:var(--gold)">Deathblade 形态</b>，期间普攻/技能 +50%，持续 <b>2</b> 回合。',Deathblade:'<b style="color:var(--gold)">Deathblade 形态</b>（卡卡罗解放强化 · 持续 2 回合）<br>进入方式：释放<b style="color:var(--burst)">共鸣解放·杀戮武装</b>触发。<br>· 普攻/技能 +<b>50%</b><br>· 3 链：解放期间导电伤害 +<b>25%</b><br>· 6 链：每次重击·死告召唤 2 个猎杀影协同攻击（atk × 100% 导电）<br>· 2 回合后自动退出，重新攒满能量再开',想象力:'<b style="color:#a78bff">想象力</b>（洛可可共鸣回路）<br><b style="color:var(--accent)">共鸣技能·高难度设计</b>回 100 想象力 + 10 协奏。普攻每段给全队<b style="color:#a78bff">湮灭伤害</b> +10%（满 3 层 +40%）。',迷离:'<b style="color:#a78bff">迷离</b>（坎特蕾拉共鸣回路）<br><b style="color:var(--accent)">共鸣技能</b>每次释放 +1 点。配合<b style="color:#a78bff">迷梦</b>状态触发<b style="color:#a78bff">惊醒</b>爆发伤害。',迷梦:'<b style="color:#a78bff">迷梦</b>（坎特蕾拉 debuff）<br><b style="color:var(--burst)">共鸣解放·陷溺</b>给目标附加迷梦状态，触发<b style="color:#a78bff">惊醒</b>大幅放大伤害（2 链 +245%）。',惊醒:'<b style="color:var(--gold)">惊醒</b>（坎特蕾拉爆发触发）<br>对带<b style="color:#a78bff">迷梦</b>状态的目标命中时触发，造成<b class="term-burst">共鸣解放</b>类型伤害。',蜃境:'<b style="color:#a78bff">蜃境</b>（坎特蕾拉解放后状态）<br>进入方式：3 链：施放<b style="color:var(--burst)">共鸣解放·陷溺</b>后直接进入；无 3 链时需要触发条件（迷离满 + 释放陷溺）。<br>· 4 链：蜃境期间治疗加成 +<b>25%</b><br>· 是坎特蕾拉的输出窗口，配合<b>惊醒</b>触发爆发<br>· 重复释放陷溺不会重复进入',光噪效应:'<b style="color:var(--accent)">光噪效应</b>（菲比 debuff · 衍射易伤）<br>由<b style="color:var(--accent)">共鸣技能·FFF</b>的<b class="term-resource">镜之环</b>附加。<b style="color:#ff8c5e">重击·星辉</b>引爆：2 链对光噪目标伤害 +120%。',福音:'<b style="color:#a78bff">福音</b>（菲比共鸣回路 · 切换形态）<br>普攻/共鸣技能积累，满 <b>1</b> 点可消耗切换<b style="color:var(--gold)">赦罪</b>/<b style="color:#a78bff">告解</b>双形态。<br><br>切换规则：<br>· 默认：<b style="color:var(--gold)">赦罪</b>形态（衍射 buff 主导）<br>· 施放<b style="color:var(--accent)">共鸣技能·FFF</b>时消耗 <b>1</b> 福音切换到<b style="color:#a78bff">告解</b><br>· 再次施放共鸣技能切回赦罪<br>· 战斗开始 / 切人入场重置为赦罪',赦罪:'<b style="color:var(--gold)">赦罪</b>（菲比形态 1 · 默认形态）<br>强化共鸣解放的形态：<br>· 解放·启明之誓愿伤害倍率从 <b>255%</b> 提升到 <b>480%</b>（1 链）<br>· 重击星辉伤害 +<b>91%</b>（3 链）<br>· 战斗开始默认进入此形态<br>· 用<b style="color:#a78bff">福音</b>切换到<b>告解</b>形态',告解:'<b style="color:#a78bff">告解</b>（菲比形态 2 · 切换形态）<br>强化重击的形态：<br>· 重击·星辉伤害 +<b>249%</b>（3 链）<br>· FFF 镜之环叠满光噪（1 链：附加层数提升至上限）<br>· 用<b style="color:#a78bff">福音</b>从赦罪切换而来；再次施放共鸣技能切回',航向:'<b style="color:#ff8c5e">航向确定！</b>（布兰特延奏）<br>切下场后给登场角色加 buff；2 链：20 秒内队友共鸣技能命中时触发布兰特爆炸 atk×440% 热熔。',羊咩:'<b style="color:#ff8c5e">羊咩</b>（安可常态攻击体系）<br>安可与白咩/黑咩玩偶一起攻击。常态下是<b class="term-normal">羊咩出击</b> + <b class="term-skill">热力羊咩</b>；释放<b class="term-burst">黑咩大暴走</b>后进入黑咩形态。',失序值:'<b style="color:#a78bff">失序值</b>（安可共鸣回路 · 0-100）<br>普攻 +<b>20</b> / 共鸣技能 +<b>35</b> / 变奏 +<b>30</b>；黑咩窗口内命中额外 +<b>10</b>。<br>满 <b>100</b> 时施放重击，消耗全部失序值并触发<b class="term-burst">白咩·失控之炎</b>或<b class="term-burst">黑咩·暴走之炎</b>（均视为共鸣解放伤害）。',黑咩大暴走:'<b style="color:#a78bff">黑咩大暴走</b>（安可共鸣解放 · 强化形态）<br>释放后进入<b style="color:#a78bff">黑咩形态</b>，持续 <b>4</b> 回合。期间攻击和技能获得强化，命中额外 +<b>10</b> <b class="term-resource">失序值</b>。',行狮:'<b style="color:var(--gold)">行狮形态</b>（凌阳解放强化 · 持续战斗剩余时间）<br>进入方式：释放<b style="color:var(--burst)">共鸣解放·狮子奋迅</b>触发。<br>· 3 链：普攻 +<b>20%</b> / 共鸣技能 +<b>10%</b><br>· 6 链：每次共鸣技能·飞身式后，下次普攻 +<b>100%</b><br>· 1 链：行狮状态期间抗打断<br>· 形态持续到下一次进入战斗 / 切人下场',架势:'<b style="color:var(--green)">架势</b>（鉴心战斗状态）<br>进入方式：施放<b style="color:var(--accent)">共鸣技能·静气循行</b>。<br>· 进入架势姿态保持 <b>1</b> 回合<br>· 期间可施放<b style="color:var(--accent)">行气反击</b>（3 链：架势保持后才能打出）<br>· 2 链：静气循行使用次数 +<b>1</b><br>· 5 链：解放·涤净力场范围 +<b>33%</b>',雾化分身:'<b style="color:var(--green)">雾化分身</b>（秋水召唤物）<br><b style="color:var(--accent)">共鸣技能·移位戏法</b>召唤；嘲讽敌人，2 链：秋水攻击被嘲讽目标 +15% 攻击。',热压弹:'<b style="color:#ff8c5e">热压弹</b>（炽霞解放资源）<br><b style="color:var(--burst)">共鸣解放·炽烈焰火</b>开启时获 60 发，配合重置技能 CD 实现高速持续输出。',朱蚀之刻:'<b style="color:#a78bff">朱蚀之刻</b>（丹瑾 debuff）<br><b style="color:var(--accent)">共鸣技能·朱蚀之刻</b>给目标附加。攻击带朱蚀的目标时丹瑾攻击 +5%/层（满 6 层 +30%），伤害 +20%（2 链）。',彤华:'<b style="color:#a78bff">彤华</b>（丹瑾共鸣回路 · 0-100）<br>≥ 60 时丹瑾暴击 +15%（4 链）。<b style="color:#ff8c5e">重击·缭乱</b>消耗所有彤华。',雷厉风行:'<b style="color:#7bd6ff">雷厉风行</b>（渊武战斗状态）<br>1 链：进入后普攻/重击攻速 +20%（等效提升攻击 +10%）。',诗中物:'<b style="color:#7bd6ff">诗中物</b>（釉瑚共鸣回路）<br>对偶/联珠/合说三种叠层触发不同效果；2 链：对偶/联珠/合说对诗中物的伤害额外生效一次。',冰绽:'<b style="color:#7bd6ff">冰绽</b>（散华共鸣回路 · 冰锥引爆）<br><b style="color:#ff8c5e">重击·爆裂</b>引爆累计的<b>冰棘</b>/<b>冰棱</b>/<b>冰川</b>造成冷凝伤害。<br>· 5 链：冰绽暴击伤害 +<b>100%</b>，冰棘/冰棱/冰川消失时自动爆炸（不需手动引爆）<br>· 6 链：引爆冰棱/冰川后全队攻击 +<b>10%</b>，可叠 <b>2</b> 层',焕彩:'<b style="color:var(--gold)">焕彩</b>（珂莱塔解放 debuff · 停滞效果）<br><b style="color:var(--burst)">共鸣解放·死兆</b>的射击命中目标时附加：<br>· 目标持续时间内无法行动（停滞）<br>· 受到伤害或持续 <b>1.5</b> 秒时清除',行气反击:'<b style="color:var(--accent)">行气反击</b>（鉴心派生技能 · 架势后触发）<br>处于<b>架势</b>状态时，下次施放<b style="color:var(--accent)">共鸣技能</b>会变为<b>行气反击</b>。<br>· 高倍率气动伤害<br>· 6 链：在重击·混元气旋期间可施放<b>特殊行气反击</b>（atk × <b>557%</b> 重击类型）',迷失羔羊:'<b style="color:#a78bff">迷失羔羊</b>（安可 6 链 buff · 0-5 层）<br><b style="color:var(--burst)">共鸣解放·黑咩大暴走</b>期间，每次造成伤害自身叠 <b>1</b> 层，每层使攻击 +<b>5%</b>，最多 <b>5</b> 层（满层 +25% 攻击）。',空中攻击:'<b style="color:#ff8c5e">空中攻击</b>（部分角色机制）<br>跳跃 / 腾空后的派生攻击。战斗中按<b style="color:#ff8c5e">重击</b>类型结算，享受重击伤害加成。典型代表：卡提希娅、布兰特、秧秧。',空中攻击空翻:'<b style="color:#ff8c5e">空中攻击空翻</b>（布兰特机制）<br>布兰特在空中做空翻，是其核心爆发段。每次空翻给布兰特<b style="color:#ff8c5e">"跟随洋流和信风"</b> +1 层伤害提升（1 链）。战斗中按<b style="color:#ff8c5e">重击</b>类型结算。',空中释羽:'<b style="color:#ff8c5e">空中释羽</b>（秧秧标志性输出段）<br>秧秧跳跃后释放羽箭群的派生<b style="color:#ff8c5e">重击</b>。是秧秧的主要爆发段。<br>· 4 链：空中释羽伤害 +<b>95%</b><br>· 6 链：施放后全队攻击 +<b>20%</b>，持续 20 秒',闪避反击:'<b style="color:var(--green)">闪避反击</b>（部分角色机制）<br>成功闪避后立刻反击的派生动作。战斗中视作变奏类派生，通常用于触发角色的反击/追击效果。',"强化·前扑":'<b style="color:var(--accent)">强化·前扑</b>（灯灯派生）<br>灯灯特定条件下普攻强化为前扑，向目标突进。<br>· 2 链：前扑攻击无视 <b>20%</b> 防御',"强化·后撤":'<b style="color:var(--accent)">强化·后撤</b>（灯灯派生）<br>灯灯特定条件下普攻强化为后撤，拉远距离同时攻击。<br>· 1 链：后撤后 <b>3</b> 秒内回复 <b>60%</b> 耐力<br>· 2 链：后撤攻击无视 <b>20%</b> 防御',牵引:'<b style="color:var(--green)">牵引</b>（控场效果）<br>把附近敌人拉到一起，方便范围伤害命中更多目标。战斗中表现为聚怪效果，提高 AOE 技能的命中价值。典型代表：秧秧·风场鸣声、菲比·镜之环。',风场鸣声:'<b style="color:var(--accent)">风场鸣声</b>（秧秧共鸣技能）<br>召唤气动风场，<b>牵引</b>范围内敌人到一起。<br>· 3 链：风场牵引范围 +<b>33%</b>',停滞:'<b style="color:var(--gold)">停滞</b>（控制 debuff）<br>使目标短暂无法行动的状态，类似"冻结"但只锁动作不锁伤害。<br>触发：珂莱塔·焕彩、菲比·镜之环、坎特蕾拉·迷梦、布兰特·火焰归亡曲等。',嘲讽:'<b style="color:var(--green)">嘲讽</b>（仇恨控制 debuff）<br>使敌人优先攻击指定目标，保护队伍中的输出角色。典型代表：秋水·雾化分身。',协同攻击:'<b style="color:var(--accent)">协同攻击</b>（召唤物/链接攻击）<br>角色下场后由召唤物/连接物触发的攻击。在模拟器中由其他机制触发，享受当前角色的攻击/暴击。< l .15s}.pc-cell-free{border-top:2px solid rgba(123,214,255,.3)}.pc-cell-paid{border-bottom:2px solid rgba(245,207,107,.3)}.pc-cell-free.canclaim,.pc-cell-paid.canclaim{background:#f5cf6b2e;border-color:var(--gold);cursor:pointer;box-shadow:0 0 8px #f5cf6b66;animation:pc-glow 1.5s ease-in-out infinite alternate}@keyframes pc-glow{0%{box-shadow:0 0 4px #f5cf6b4d}to{box-shadow:0 0 12px #f5cf6bb3}}.pc-cell-free.canclaim:hover,.pc-cell-paid.canclaim:hover{transform:translateY(-1px)}.pc-cell-free.claimed,.pc-cell-paid.claimed{opacity:.4;background:#0000004d}.pc-cell-free.claimed:after,.pc-cell-paid.claimed:after{content:"✓";position:absolute;right:3px;top:1px;color:var(--green);font-weight:700;font-size:11px}.pc-cell-paid.locked{opacity:.45;background:#140c0880}.lock-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;opacity:.7}.rw{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-content:center;line-height:1.2}.rc{display:inline-block;background:#ffffff0d;border-radius:3px;padding:1px 4px;font-size:10px;color:var(--text);white-space:nowrap}.rc-astrite{color:var(--accent)}.rc-lunite{color:var(--purple)}.rc-radiant{color:var(--r-radiant)}.rc-forging{color:var(--r-forging)}.rc-lustrous{color:var(--r-lustrous)}.rc-super{color:var(--gold)}.rc-box{color:var(--gold);background:#f5cf6b2e;border:1px solid rgba(245,207,107,.4);font-weight:700}.rc-cos{color:var(--purple);background:#c39bff1f}.dim{color:var(--dim)}.pc-tasks{margin-top:18px;display:flex;flex-direction:column;gap:14px}.pct-bucket{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}.pct-bucket-head{font-size:13px;color:var(--gold);letter-spacing:1px;margin-bottom:8px;font-weight:600}.pct-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}.pct{background:#00000040;border:1px solid var(--line);border-radius:6px;padding:6px 10px}.pct.pct-done{background:#8de6a614;border-color:#8de6a64d}.pct-name{font-size:12px;color:var(--text);margin-bottom:4px}.pct-bar{background:#0006;height:5px;border-radius:3px;overflow:hidden;margin-bottom:3px}.pct-fill{background:linear-gradient(90deg,var(--accent),var(--gold));height:100%;transition:width .3s}.pct-info{font-size:10px;color:var(--dim);letter-spacing:.5px}.pct.pct-done .pct-info{color:var(--green)}

<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">鸣 潮 · 唤 取</div>
    <div class="gres" id="gres"></div>
  </div>
</div>

<div class="app">
  <div class="timeline">
    <div class="ti">
      <div class="now" id="dateNow">2024-05-23</div>
      <div class="meta" id="dateMeta"></div>
    </div>
    <div class="t-actions">
      <button class="tbtn" id="nextDay">＋1 日</button>
      <button class="tbtn" id="nextPhase">下一期</button>
      <button class="tbtn" id="todayBtn">今 天</button>
      <span class="t-sep"></span>
      <button class="tbtn" id="nextVersion">下版本</button>
      <button class="tbtn" id="pickVersion">选版本</button>
      <span class="t-sep"></span>
      <button class="tbtn" id="saveMgmt">存 档</button>
      <button class="tbtn danger" id="reset">重 置</button>
    </div>
  </div>

  <!-- 顶层视图切换 · 由 Preact <ViewTabs/> 接管(AppShell 第二小步) -->
  <div id="viewTabs"></div>

  <!-- ====== 视图 1：唤取 ====== -->
  <!-- #viewGacha 内部静态结构由 preact <GachaPanel/> 接管（Stage 6.1b），mount 时清空重建。
       内部 #bnTabs/#bnArt/#costPanel/#pityRow/#pull1/#pull10/#lbl1/#lbl10/#toFive/#free10/
       #roles/#paneStat/#paneEx/#paneLog/#sTotal 等所有 id 在 mount 后不复存在，
       请勿通过 getElementById 查询这些节点。 -->
  <div class="view" id="viewGacha">
    <!-- 上：卡池 + 抽卡 -->
    <div class="section-top">
      <div class="banner-wrap">
        <div class="banner-tabs" id="bnTabs"></div>
        <div class="banner-art" id="bnArt"></div>
      </div>

      <div class="pull-card">
        <div class="cost-panel" id="costPanel"></div>
        <div class="pity-row" id="pityRow"></div>
        <div class="pull-btns">
          <button class="pbtn" id="pull1"><span class="big">唤取</span><span class="small" id="lbl1">× 1</span></button>
          <button class="pbtn" id="pull10"><span class="big">十连唤取</span><span class="small" id="lbl10">× 10</span></button>
        </div>
        <div class="pull-extras">
          <button class="xbtn" id="toFive">抽到下个五星</button>
          <button class="xbtn" id="free10">试手十连</button>
        </div>
      </div>
    </div>

    <!-- 下：左角色 + 右侧栏 tab（统计 / 海市 / 记录） -->
    <div class="section-bot">
      <div class="col">
        <div class="col-wrap">
          <h2 class="col-head">角 色 与 共 鸣 链</h2>
          <div class="roles" id="roles"></div>
        </div>
      </div>

      <div class="col">
        <div class="col-wrap">
          <div class="side-tabs">
            <div class="s-tab on" data-s="stat">统 计</div>
            <div class="s-tab" data-s="ex">海 市</div>
            <div class="s-tab" data-s="log">记 录</div>
          </div>

          <div class="pane" id="paneStat">
            <div class="stats">
              <div class="stat"><b id="sTotal">0</b><span>总抽数</span></div>
              <div class="stat"><b id="sFive">0</b><span>五星</span></div>
              <div class="stat"><b id="sFour">0</b><span>四星</span></div>
              <div class="stat"><b id="sAvg">-</b><span>出金均值</span></div>
              <div class="stat"><b id="sUp">0</b><span>提升命中</span></div>
              <div class="stat"><b id="sWave">0</b><span>波段持有</span></div>
              <div class="stat"><b id="sCharPity">0</b><span>角色垫</span></div>
              <div class="stat"><b id="sWeapPity">0</b><span>武器垫</span></div>
              <div class="stat"><b id="sRoles">0</b><span>已拥角色</span></div>
              <div class="stat"><b id="sWeapons">0</b><span>已拥武器</span></div>
            </div>
            <div id="sCollectionDetail" style="margin-top:10px;font-size:11px;color:var(--muted);text-align:center;letter-spacing:.5px"></div>
          </div>

          <div class="pane" id="paneEx" style="display:none">
            <h2 class="col-head" style="margin-top:0">海 市 珊 瑚</h2>
            <div class="coral-bar">
              <div class="coral"><div class="l">余 波 珊 瑚</div><div class="v" id="cAg">0</div>
                <div class="h" id="cAgHint">可换 0 抽</div></div>
              <div class="coral osc"><div class="l">残 振 珊 瑚</div><div class="v" id="cOs">0</div>
                <div class="h" id="cOsHint">可换 0 抽</div></div>
            </div>
            <h2 class="col-head" style="margin-top:14px">波 纹 兑 换</h2>
            <div class="exch-list" id="exList"></div>
            <h2 class="col-head" style="margin-top:14px">角 色 波 段</h2>
            <div class="exch-list" id="waveList"></div>
          </div>

          <div class="pane" id="paneLog" style="display:none">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <span style="font-size:11px;color:var(--muted);letter-spacing:1px">最近 200 条</span>
              <button class="mbtn" id="clearLog">清空</button>
            </div>
            <div class="log" id="logList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 视图 2：冒险 ====== -->
  <div class="view" id="viewAdventure" style="display:none">
    <div class="col-wrap">
      <div class="side-tabs">
        <div class="a-tab on" data-a="team">编 队</div>
        <div class="a-tab" data-a="daily">日 常</div>
        <div class="a-tab" data-a="dungeon">副 本</div>
        <div class="a-tab" data-a="abyss">深 塔</div>
        <div class="a-tab" data-a="wastes">海 墟</div>
      </div>
      <div class="pane" id="paneTeam"></div>
      <div class="pane" id="paneDaily" style="display:none"></div>
      <div class="pane" id="paneDungeon" style="display:none"></div>
      <div class="pane" id="paneAbyss" style="display:none"></div>
      <div class="pane" id="paneWastes" style="display:none"></div>
    </div>
  </div>

  <!-- ====== 视图 3：背包（独立顶层 tab）====== -->
  <div class="view" id="viewBag" style="display:none">
    <div class="col-wrap">
      <div id="paneBag"></div>
    </div>
  </div>

  <!-- ====== 视图 4：商店 ====== -->
  <div class="view" id="viewStorage" style="display:none">
    <div class="col-wrap">
      <div class="side-tabs">
        <div class="b-tab on" data-b="podcast">电 台</div>
        <div class="b-tab" data-b="shop">商 店</div>
      </div>
      <div class="pane" id="panePodcast"></div>
      <!-- #paneShop 内部静态结构由 preact <ShopPanel/> 接管（Stage 6.1b），mount 时清空重建。
           内部 #kSpent/#kLunite/#kDays/#scFeatured/#scRegular/#scTopup/#bannerFeatured 等id
           在 mount 后不复存在，请勿通过 getElementById 查询。 -->
      <div class="pane" id="paneShop" style="display:none">
        <h2 class="col-head" style="margin-top:0">钱 包</h2>
        <div class="shop-bar">
          <div class="sb spent"><div class="l">累计充值</div><div class="v" id="kSpent">¥0</div></div>
          <div class="sb lun"><div class="l">月相库存</div><div class="v" id="kLunite">0</div></div>
          <div class="sb days"><div class="l">月卡剩余</div><div class="v" id="kDays">0</div></div>
        </div>

        <!-- 商店分类 tab -->
        <div class="shop-cat-tabs">
          <button class="sct on" data-sc="featured">特惠专区</button>
          <button class="sct" data-sc="regular">常驻礼包</button>
          <button class="sct" data-sc="topup">凝刻月相</button>
        </div>

        <!-- 特惠专区：月卡 + 战令 + 限购礼包 -->
        <div class="shop-cat" id="scFeatured">
          <div class="shop-banners" id="bannerFeatured"></div>
        </div>

        <!-- 常驻礼包：长期不下架的礼包（暂时也是 bundle 里的，按 period 区分） -->
        <div class="shop-cat" id="scRegular" style="display:none">
          <div class="shop-banners" id="bannerRegular"></div>
        </div>

        <!-- 凝刻月相（直充） -->
        <div class="shop-cat" id="scTopup" style="display:none">
          <div class="shop-banners topup-grid" id="bannerTopup"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 全局 toast -->
  <div class="toast" id="toast"></div>
</div>

<!-- 抽卡动画 -->
<div class="overlay" id="ov">
  <div class="ov-title" id="ovTitle"></div>
  <div class="beam" id="beam"></div>
  <div class="sparks" id="sparks"></div>
  <div class="cards-wrap" id="cards"></div>
</div>
<div class="skip-hint" id="skipHint">点击屏幕翻开所有 · 再次点击关闭</div>

<!-- 角色详情弹窗（外层，独立 mount 节点，避免与子 modal 共用 #modalBox）-->
<div class="modal" id="roleModal">
  <div class="modal-box role-modal" id="roleModalBox"></div>
</div>
<!-- 通用弹窗（子 modal，DOM 在后故层级在上）-->
<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- 战斗界面（全屏覆盖） -->
<div id="battleOverlay" style="display:none;position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);align-items:flex-start;justify-content:center;overflow-y:auto"></div>

<!-- Preact 根挂载点 (Stage 1 起,新 UI 组件挂这里;暂时是空的) -->
<div id="preact-root"></div>

</body>
</html>
