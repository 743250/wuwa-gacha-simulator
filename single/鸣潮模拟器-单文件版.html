非常感谢大家对于《鸣潮》的关注！在《鸣潮》上线后，对于众多玩家反馈的游戏运行性能问题，如卡顿、卡死、掉帧、发热、画面模糊、游戏崩溃和闪退等情况，目前项目组正在积极排查问题，并已在处理中。

由于性能问题带来的体验不佳，项目组在此向所有关心《鸣潮》的漂泊者郑重道歉。很抱歉在第一次正式和大家见面的时候，没能带来更好的游戏体验，也给所有期待着《鸣潮》的漂泊者带来了不必要的困扰，让大家失望了。

与此同时，我们决定针对上述问题导致的体验不佳，在5月24日6:00（UTC+8）向全体漂泊者发放补偿：唤声涡纹*10。

此外，项目组已经在第一时间针对大家反馈较多的紧急问题进行更新修复（如无法登录、短时间内发热过烫等），优先保障游戏过程中的稳定性。对于当前版本，如在游戏过程中设备出现发热严重、崩溃现象严重等情况，项目组建议通过【设置】-【图像】确认当前设备负载状态。如出现过载状态时，建议调整图像设置，以获得更流畅的体验。

最后，还有一件事我们希望传达给各位漂泊者：性能问题一直以来都是《鸣潮》项目组持续攻坚的命题。后续我们将通过持续的线上更新，尽可能改善大家的游戏体验。具体调整进度也将通过《研发终端日志》，与大家同步与说明。

由此带来的体验不佳，我们再次深表歉意，也再次感谢所有漂泊者对于《鸣潮》一直以来的关注与支持！

✦补偿内容：唤声涡纹*10
✦领取条件：7月3日03:59（UTC+8）前完成创角，且联觉等级≥2级的玩家

《鸣潮》项目组`,rewards:{lustrous:10},source:"TapTap 官方 2024-05-24「关于性能问题及持续优化的公告说明」ID:429475503 · 唤声涡纹*10"},{id:"mail_1_0_official_apology_0525",date:"2024-05-24",category:"apology",title:"关于游戏体验问题及持续优化的公告说明",body:`亲爱的漂泊者：

在《鸣潮》上线后，关于众多漂泊者反映的游戏体验相关问题，非常抱歉没有给大家带来更好的游戏体验。我们将在近期通过游戏更新，优化游戏内容体验不佳的问题。同时为了表达项目组的歉意，我们将在5月25日10:00（UTC+8）向全体漂泊者额外发放补偿：浮金波纹*10。

✦补偿内容：浮金波纹*10
✦领取条件：7月3日03:59（UTC+8）前完成创角，且联觉等级≥2级的玩家

除了当前正在进行中的性能问题优化，关于游戏内容，具体调整内容及后续重点开发方向如下：

（一）优化跳过功能
针对目前漂泊者反馈的“剧情跳过范围少、跳过按钮展示不明确、主线内容冗长”等问题进行调整。优化方向：支持全量剧情跳过，同时也支持剧情文本及过场演出的记录回溯。包括如下内容：
1. 修改【跳过】按钮展示图标；
2. 大幅度增加主线剧情的跳过范围，包括序章及第一幕剧情的跳过；
3. 支持站桩对话的跳过；
4. 近期内开放共鸣者【吟霖】伴星任务。
由于技术性原因限制，剧情中的过场演出暂时无法实装跳过功能。由此带来的不便，感谢漂泊者的理解！

（二）优化战斗体验
针对战斗过程中，漂泊者反馈较多的打击感不佳、受击反馈弱、手柄模式体验不佳、战斗过程中的视野遮挡等问题，项目组将结合不同战斗场景进行专项优化，目标是尽可能提升战斗过程的正向反馈。同时手柄功能优化、按键自定义开放条件过晚等问题已在同步改善中。

（三）感谢漂泊者的支持，追加自选常驻5星角色答谢礼
在公测后，我们从各个社区和平台收到了大量关于【新手唤取活动】的反馈。对于活动过程中造成的体验不佳我们深表歉意。因此，我们将在5月26日10:00（UTC+8），通过邮件向全体漂泊者发放特别道具【潮声答谢券】，使用后可获得1位自选常驻5星角色，该活动有效期至2025年5月22日11:59（UTC+8）前。详细活动规则，请后续前往游戏内公告查看。

（四）更多优化内容、更多版本内容持续开发中
后续我们将优化游戏内容，更多功能及玩法活动也在持续开发中。例如：优化部分NPC美术资源、增加分层地图功能、更多声骸变身玩法……等等内容，也在持续开发当中。

我们深知现在的《鸣潮》仍有许多不足，后续我们将持续打磨游戏内容及游戏体验。再次感谢所有漂泊者对于《鸣潮》的关注与支持！

3 链按消耗焰光 +2%/点 最多 +200%）<br>· 6 链：焰光 <70 立即回 70（每场 1 次）；致死不倒（每场 1 次）',重斩:'<b style="color:#ff9b3a">重斩</b>（赞妮灼焰形态内普攻键替换 · 重击伤害类型）<br>消耗 2 AP + 20 焰光，对主目标造成 HP × 12% 衍射伤害（6 链 ×1.4 = HP × 16.8%）。CD 1 回合。灼焰形态外不可用。',终绝将至之刻:'<b style="color:var(--gold)">终绝将至之刻</b>（赞妮终结解放 · 自动触发）<br><b class="term-state">灼焰形态</b> 3 回合结束时自动施放，不消耗 AP。<br>对主目标造成 HP × 20% 衍射伤害（副目标半额）。<br>3 链：按本场消耗焰光总量每点 +2%（最多 +200% → HP × 60%）。<br>施放后退出灼焰形态、清空焰光。',烈阳余烬:'<b style="color:#ff9b3a">烈阳余烬</b>（赞妮团队资源）<br>处于<b class="term-state">灼焰形态</b>时每回合自动回复 <b>10</b> 焰光。',乐声:'<b style="color:#c39bff">乐声</b>（弗洛洛专属资源 · 上限 6 枚）<br>普攻、共鸣技能、重击、变奏入场时获得 1 枚，战斗开始时获得 4 枚（固有·八重奏）。指挥状态期间赫卡忒每次攻击命中获得 1 枚。乐声满 6 枚时，重击替换为<b class="term-heavy">谱曲终末</b>。',余响:'<b style="color:#c39bff">余响</b>（弗洛洛共鸣回路 · 上限 24 层）<br>战斗开始时获得 10 层（固有·八重奏）；赫卡忒每次攻击命中获得 1 层；共鸣链描述的相应效果额外获得。每层余响使<b class="term-heavy">谱曲终末</b>攻击倍率绝对提升 30%（2 链为 52.5%）。施放谱曲终末后消耗全部余响。每层余响使弗洛洛暴击伤害提升 2.5%（固有·八重奏）。弗洛洛不上场时，余响于 3 回合后消散。',定音:'<b style="color:var(--accent)">定音</b>（弗洛洛状态）<br>施放<b class="term-heavy">谱曲终末</b>后进入。处于定音状态时方可施放<b class="term-burst">共鸣解放·往日深渊的圆舞曲</b>。施放共鸣解放后退出定音，进入<b class="term-state">指挥状态</b>。',指挥状态:'<b style="color:#9b6dff">指挥状态</b>（弗洛洛共鸣解放后状态 · 持续 3 回合）<br>施放<b style="color:var(--gold)">共鸣解放·往日深渊的圆舞曲</b>后进入，持续 3 回合。指挥状态期间：弗洛洛攻击提升 120%，本人可正常行动；召唤<b class="term-resource">赫卡忒</b>协助战斗，命中后触发协同/强化追击。弗洛洛为登场角色时，赫卡忒与弗洛洛共伤（同额受伤，不替挡）。切换其他角色时指挥状态结束，赫卡忒随之消散。<br>5 链：指挥状态期间受到的伤害降低 30%。<br>6 链：弗洛洛为登场角色时湮灭伤害加成提升 60%；弗洛洛为非登场角色时，目标受到赫卡忒和弗洛洛的伤害提升 36%。',赫卡忒:'<b style="color:#9b6dff">赫卡忒</b>（弗洛洛召唤单位 · 仅指挥状态期间存在）<br>弗洛洛施放共鸣解放进入指挥状态时召唤；大招前不会出现。生命值等于弗洛洛当前生命值，继承弗洛洛属性。指挥期间弗洛洛普攻/技能/重击/变奏命中后触发协同追击，造成攻击 56% 的湮灭伤害，并获得 1 枚<b class="term-resource">乐声</b>及 1 层<b class="term-resource">余响</b>。每第 2 次协同后施放强化追击，造成攻击 340% 的湮灭伤害（6 链为 421.6%），同样获得 1 枚乐声及 1 层余响。6 链指挥期间普攻/技能另追加重世幻象（攻击 216.4% +8 余响）。弗洛洛为登场角色时，赫卡忒受到多少伤害，弗洛洛同样受到多少伤害（共伤，不替挡）。不可被玩家操控，不可切换。',亡与死的乐章:'<b style="color:var(--accent)">亡与死的乐章</b>（弗洛洛 · 重世普攻派生）<br>官方由基础普攻进入重世后派生；模拟器将两段动作合并为普攻按钮。造成攻击 <b>505%</b> 的湮灭伤害，1 链提升至 <b>909%</b>。',永不消逝的梦 color:var(--accent)">共鸣技能·高难度设计</b>回 100 想象力 + 10 协奏。普攻每段给全队<b style="color:#a78bff">湮灭伤害</b> +10%（满 3 层 +40%）。',迷离:'<b style="color:#a78bff">迷离</b>（坎特蕾拉共鸣回路）<br><b style="color:var(--accent)">共鸣技能</b>每次释放 +1 点。配合<b style="color:#a78bff">迷梦</b>状态触发<b style="color:#a78bff">惊醒</b>爆发伤害。',迷梦:'<b style="color:#a78bff">迷梦</b>（坎特蕾拉）<br><b style="color:var(--burst)">共鸣解放·陷溺</b>给目标附加迷梦状态，触发<b style="color:#a78bff">惊醒</b>大幅放大伤害（2 链 +245%）。',惊醒:'<b style="color:var(--gold)">惊醒</b>（坎特蕾拉爆发触发）<br>对带<b style="color:#a78bff">迷梦</b>状态的目标命中时触发，造成<b class="term-burst">共鸣解放</b>类型伤害。',蜃境:'<b style="color:#a78bff">蜃境</b>（坎特蕾拉解放后状态）<br>进入方式：3 链：施放<b style="color:var(--burst)">共鸣解放·陷溺</b>后直接进入；无 3 链时需要触发条件（迷离满 + 释放陷溺）。<br>· 4 链：蜃境期间治疗加成 +<b>25%</b><br>· 是坎特蕾拉的输出窗口，配合<b>惊醒</b>触发爆发<br>· 重复释放陷溺不会重复进入',光噪效应:'<b style="color:var(--accent)">光噪效应</b>（菲比 · 衍射易伤）<br>由<b style="color:var(--accent)">共鸣技能·FFF</b>的<b class="term-resource">镜之环</b>附加。<b style="color:#ff8c5e">重击·星辉</b>引爆：2 链对光噪目标伤害 +120%。',福音:'<b style="color:#a78bff">福音</b>（菲比共鸣回路 · 切换形态）<br>普攻/共鸣技能积累，满 <b>1</b> 点可消耗切换<b style="color:var(--gold)">赦罪</b>/<b style="color:#a78bff">告解</b>双形态。<br><br>切换规则：<br>· 默认：<b style="color:var(--gold)">赦罪</b>形态（衍射 buff 主导）<br>· 施放<b style="color:var(--accent)">共鸣技能·FFF</b>时消耗 <b>1</b> 福音切换到<b style="color:#a78bff">告解</b><br>· 再次施放共鸣技能切回赦罪<br>· 战斗开始 / 切人入场重置为赦罪',赦罪:'<b style="color:var(--gold)">赦罪</b>（菲比形态 1 · 默认形态）<br>强化共鸣解放的形态：<br>· 解放·启明之誓愿伤害倍率从 <b>255%</b> 提升到 <b>480%</b>（1 链）<br>· 重击星辉伤害 +<b>91%</b>（3 链）<br>· 战斗开始默认进入此形态<br>· 用<b style="color:#a78bff">福音</b>切换到<b>告解</b>形态',告解:'<b style="color:#a78bff">告解</b>（菲比形态 2 · 切换形态）<br>强化重击的形态：<br>· 重击·星辉伤害 +<b>249%</b>（3 链）<br>· FFF 镜之环叠满光噪（1 链：附加层数提升至上限）<br>· 用<b style="color:#a78bff">福音</b>从赦罪切换而来；再次施放共鸣技能切回',航向:'<b style="color:#ff8c5e">航向确定！</b>（布兰特延奏）<br>切下场后给登场角色加 buff；2 链：4 回合内队友共鸣技能命中时触发布兰特爆炸 atk×440% 热熔。',羊咩:'<b style="color:#ff8c5e">羊咩</b>（安可常态攻击体系）<br>安可与白咩/黑咩玩偶一起攻击。常态下是<b class="term-normal">羊咩出击</b> + <b class="term-skill">热力羊咩</b>；释放<b class=" >1.6</b>（诗中物折算）',光能:'<b style="color:#7bd6ff">光能</b>（灯灯 FORTE 资源 · 0-100）<br>普攻 +<b>10</b> / 共鸣技能 +<b>20</b> / 共鸣解放 +<b>30</b> 积累。<br>· 满值时<b style="color:var(--accent)">共鸣技能·灯光探照</b>倍率 ×<b>1.7</b>（强化·前扑/后撤折算）',啾啾专送:'<b style="color:#7bd6ff">啾啾专送</b>（灯灯共鸣解放）<br>灯灯将啾啾巨大化投掷攻击目标，造成导电伤害。<br>· 3 链：伤害加成 +<b>30%</b><br>· 6 链：施放时全队攻击 +<b>20%</b>（3 回合）',冰绽:'<b style="color:#7bd6ff">冰绽</b>（散华共鸣回路）<br>等同于满<b class="term-resource">冰棘</b>时的<b class="term-heavy">重击·爆裂</b>结算。<br>· 5 链：爆裂暴击伤害 +<b>100%</b>',冰棘:'<b style="color:#7bd6ff">冰棘</b>（散华 FORTE）<br>上限 <b>100</b>。普攻 +<b>10</b> / 技能 +<b>20</b> / 解放 +<b>30</b> / 变奏 +<b>15</b>。<br>满值可施放<b class="term-heavy">重击·爆裂</b>（atk×<b>370%</b>），爆裂后清空。',凛絜:'<b style="color:#7bd6ff">凛絜</b>（散华延奏）<br>下一位登场角色普攻伤害加深 <b>38%</b>，持续 <b>2</b> 回合；该角色再被切换时提前结束。',焕彩:'<b style="color:var(--gold)">焕彩</b>（珂莱塔解放 · 停滞效果）<br><b style="color:var(--burst)">共鸣解放·死兆</b>的射击命中目标时附加：<br>· 目标持续时间内无法行动（停滞）<br>· 受到伤害或持续 <b>1</b> 回合时清除',行气反击:'<b style="color:var(--accent)">行气反击</b>（鉴心派生技能 · 架势后触发）<br>处于<b>架势</b>状态时，下次施放<b style="color:var(--accent)">共鸣技能</b>会变为<b>行气反击</b>。<br>· 高倍率气动伤害<br>· 6 链：在重击·混元气旋期间可施放<b>特殊行气反击</b>（atk × <b>557%</b> 重击类型）',迷失羔羊:'<b style="color:#a78bff">迷失羔羊</b>（安可 6 链 buff · 0-5 层）<br><b style="color:var(--burst)">共鸣解放·黑咩大暴走</b>期间，每次造成伤害自身叠 <b>1</b> 层，每层使攻击 +<b>5%</b>，最多 <b>5</b> 层（满层 +25% 攻击）。',空中攻击:'<b style="color:#ff8c5e">空中攻击</b>（部分角色机制）<br>跳跃 / 腾空后的派生攻击。战斗中按<b style="color:#ff8c5e">重击</b>类型结算，享受重击伤害加成。典型代表：卡提希娅、布兰特、秧秧。',空中攻击空翻:'<b style="color:#ff8c5e">空中攻击空翻</b>（布兰特机制）<br>布兰特在空中做空翻，是其核心爆发段。每次空翻给布兰特<b style="color:#ff8c5e">"跟随洋流和信风"</b> +1 层伤害提升（1 链）。战斗中按<b style="color:#ff8c5e">重击</b>类型结算。',空中释羽:'<b style="color:#ff8c5e">空中释羽</b>（秧秧标志性输出段）<br>秧秧跳跃后释放羽箭群的派生<b style="color:#ff8c5e">重击</b>。是秧秧的主要爆发段。<br>· 4 链：空中释羽伤害 +<b>95%</b><br>· 6 链：施放后全队攻击 +<b>20%</b>，持续 4 回合',闪避反击:'<b style="color:var(--green)">闪避反击</b>（部分角色机制）<br>成功闪避后立刻反击的派生动作。战斗中视作变奏类派生，通常用于触发角色的反击/追击效果。',"强化·前扑":'<b style="color:var(--accent)">强化·前扑</b>（灯灯派生）<br>灯灯特定条件下普攻强化为前扑，向目标突进。<br>· 2 链：前扑攻击无视 <b>20%</b> 防御',"强化·后撤":'<b style="color:var(--accent)">强化·后撤</b>（灯灯派生）<br>灯灯特定条件下普攻强化为后撤，拉远距离同时攻击。<br>· 1 链：后撤后 <b>1</b> 回合内回复 <b>60%</b> 耐力<br>· 2 链：后撤攻击无视 <b>20%</b> 防御',牵引:'<b style="color:var(--green)">牵引</b>（控场效果）<br>把附近敌人拉到一起，方便范围伤害命中更多目标。战斗中表现为聚怪效果，提高 AOE 技能的命中价值。典型代表：秧秧·风场鸣声、菲比·镜之环。',风场鸣声:'<b style="color:var(--accent)">风场鸣声</b>（秧秧共鸣技能）<br>召唤气动风场，<b>牵引</b>范围内敌人到一起。<br>· 3 链：风场牵引范围 +<b>33%</b>',停滞:'<b style="color:var(--gold)">停滞</b>（控制效果）<br>使目标短暂无法行动的状态，类似"冻结"但只锁动作不锁伤害。<br>触发：珂莱塔·焕彩、菲比·镜之环、坎特蕾拉·迷梦、布兰特·火焰归亡曲等。',嘲讽:'<b style="color:var(--green)">嘲讽</b>（仇恨控制）<br>使敌人优先攻击指定目标，保护队伍中的输出角色。典型代表：秋水·雾化分身。',协同攻击:'<b style="color:var(--accent)">协同攻击</b>（召唤物/链接攻击）<br>角色下场后由召唤物/连接物触发的攻击，享受当前角色的攻击/暴击。<br>典型代表：折枝·墨鹤追击、莫特斐·浮翼狂想协同、维里奈 6 链协同。',再燃:'<b style="color:#ff8c5e">再燃</b>（布兰特解放 6 链派生）<br>施放<b style="color:var(--burst)">火焰归亡曲</b>后在原地产生一次<b style="color:#ff8c5e">再燃</b>爆炸，造成火焰归亡曲 <b>30%</b> 的伤害，此次伤害为<b style="color:var(--text)">普攻</b>类型。',猎杀影:'<b style="color:#7bd6ff">猎杀影</b>（卡卡罗 6 链召唤物）<br><b style="color:var(--gold)">Deathblade</b> 形态下，每次<b style="color:#ff8c5e">重击·死告</b>召唤 <b>2</b> 个猎杀影协同攻击，每个造成 atk × <b>100%</b> 导电伤害，视为<b style="color:var(--burst)">共鸣解放</b>类型。',白鹤:'<b style="color:#7bd6ff">白鹤</b>（折枝 6 链召唤物）<br>施放<b style="color:var(--accent)">共鸣技能·以形写神</b>命中时，额外召唤 <b>1</b> 只白鹤，造成折枝 atk × 120% 冷凝伤害（共鸣技能伤害类型）。白鹤独立结算，不计入<b class="term-resource">墨鹤</b>计数。',衍构模体:'<b style="color:#7bd6ff">衍构模体</b>（相里要 1 链召唤物）<br>施放<b style="color:var(--accent)">共鸣技能·万方法则</b>时，额外生成 <b>6</b> 个衍构模体攻击目标，每个伤害倍率为万方法则的 <b>8%</b>，此次伤害视为<b style="color:var(--burst)">共鸣解放</b>类型。',织梦水母:'<b style="color:#7bd6ff">织梦水母</b>（坎特蕾拉 5 链召唤物）<br><b style="color:var(--burst)">共鸣解放·弥漫</b>召唤的水母群。每只持续协同攻击。<br>· 5 链：最大召唤数 +<b>5</b>',雷之楔:'<b style="color:var(--accent)">雷之楔</b>（渊武召唤物）<br>渊武<b style="color:var(--accent)">共鸣技能·雷之楔</b>召唤的雷电协同武器，存在期间持续协同攻击。<br>· 3 链：命中按渊武 20% 防御额外加伤<br>· 5 链：雷之楔在场时渊武解放 +<b>50%</b>',镜之环:'<b style="color:var(--accent)">镜之环</b>（菲比召唤区域）<br><b style="color:var(--accent)">共鸣技能 <body>

<div class="topbar">
  <div class="topbar-in">
    <div id="mailEntry" class="mail-entry-slot"></div>
    <div class="brand">鸣 潮 · 唤 取</div>
    <div class="gres" id="gres"></div>
  </div>
</div>

<div class="app">
  <div class="timeline">
    <div class="ti">
      <div class="now" id="dateNow">2024-05-23</div>
      <div class="meta" id="dateMeta"></div>
    </div>
    <div class="t-actions">
      <button class="tbtn" id="nextDay">＋1 日</button>
      <button class="tbtn" id="nextPhase">下一期</button>
      <button class="tbtn" id="todayBtn">今 天</button>
      <span class="t-sep"></span>
      <button class="tbtn" id="nextVersion">下版本</button>
      <button class="tbtn" id="pickVersion">选版本</button>
      <span class="t-sep"></span>
      <button class="tbtn" id="saveMgmt">存 档</button>
      <button class="tbtn danger" id="reset">重 置</button>
    </div>
  </div>

  <!-- 顶层视图切换 · 由 Preact <ViewTabs/> 接管(AppShell 第二小步) -->
  <div id="viewTabs"></div>

  <!-- ====== 视图 1：唤取 ====== -->
  <!-- #viewGacha 内部静态结构由 preact <GachaPanel/> 接管（Stage 6.1b），mount 时清空重建。
       内部 #bnTabs/#bnArt/#costPanel/#pityRow/#pull1/#pull10/#lbl1/#lbl10/#toFive/#free10/
       #roles/#paneStat/#paneEx/#paneLog/#sTotal 等所有 id 在 mount 后不复存在，
       请勿通过 getElementById 查询这些节点。 -->
  <div class="view" id="viewGacha">
    <!-- 上：卡池 + 抽卡 -->
    <div class="section-top">
      <div class="banner-wrap">
        <div class="banner-tabs" id="bnTabs"></div>
        <div class="banner-art" id="bnArt"></div>
      </div>

      <div class="pull-card">
        <div class="cost-panel" id="costPanel"></div>
        <div class="pity-row" id="pityRow"></div>
        <div class="pull-btns">
          <button class="pbtn" id="pull1"><span class="big">唤取</span><span class="small" id="lbl1">× 1</span></button>
          <button class="pbtn" id="pull10"><span class="big">十连唤取</span><span class="small" id="lbl10">× 10</span></button>
        </div>
        <div class="pull-extras">
          <button class="xbtn" id="toFive">抽到下个五星</button>
          <button class="xbtn" id="free10">试手十连</button>
        </div>
      </div>
    </div>

    <!-- 下：左角色 + 右侧栏 tab（统计 / 海市 / 记录） -->
    <div class="section-bot">
      <div class="col">
        <div class="col-wrap">
          <h2 class="col-head">角 色 与 共 鸣 链</h2>
          <div class="roles" id="roles"></div>
        </div>
      </div>

      <div class="col">
        <div class="col-wrap">
          <div class="side-tabs">
            <div class="s-tab on" data-s="stat">统 计</div>
            <div class="s-tab" data-s="ex">海 市</div>
            <div class="s-tab" data-s="log">记 录</div>
          </div>

          <div class="pane" id="paneStat">
            <div class="stats">
              <div class="stat"><b id="sTotal">0</b><span>总抽数</span></div>
              <div class="stat"><b id="sFive">0</b><span>五星</span></div>
              <div class="stat"><b id="sFour">0</b><span>四星</span></div>
              <div class="stat"><b id="sAvg">-</b><span>出金均值</span></div>
              <div class="stat"><b id="sUp">0</b><span>提升命中</span></div>
              <div class="stat"><b id="sWave">0</b><span>波段持有</span></div>
              <div class="stat"><b id="sCharPity">0</b><span>角色垫</span></div>
              <div class="stat"><b id="sWeapPity">0</b><span>武器垫</span></div>
              <div class="stat"><b id="sRoles">0</b><span>已拥角色</span></div>
              <div class="stat"><b id="sWeapons">0</b><span>已拥武器</span></div>
            </div>
            <div id="sCollectionDetail" style="margin-top:10px;font-size:11px;color:var(--muted);text-align:center;letter-spacing:.5px"></div>
          </div>

          <div class="pane" id="paneEx" style="display:none">
            <h2 class="col-head" style="margin-top:0">海 市 珊 瑚</h2>
            <div class="coral-bar">
              <div class="coral"><div class="l">余 波 珊 瑚</div><div class="v" id="cAg">0</div>
                <div class="h" id="cAgHint">可换 0 抽</div></div>
              <div class="coral osc"><div class="l">残 振 珊 瑚</div><div class="v" id="cOs">0</div>
                <div class="h" id="cOsHint">可换 0 抽</div></div>
            </div>
            <h2 class="col-head" style="margin-top:14px">波 纹 兑 换</h2>
            <div class="exch-list" id="exList"></div>
            <h2 class="col-head" style="margin-top:14px">角 色 波 段</h2>
            <div class="exch-list" id="waveList"></div>
          </div>

          <div class="pane" id="paneLog" style="display:none">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <span style="font-size:11px;color:var(--muted);letter-spacing:1px">最近 200 条</span>
              <button class="mbtn" id="clearLog">清空</button>
            </div>
            <div class="log" id="logList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 视图 2：冒险 ====== -->
  <div class="view" id="viewAdventure" style="display:none">
    <div class="col-wrap">
      <div class="side-tabs">
        <div class="a-tab on" data-a="team">编 队</div>
        <div class="a-tab" data-a="daily">日 常</div>
        <div class="a-tab" data-a="dungeon">副 本</div>
        <div class="a-tab" data-a="abyss">深 塔</div>
        <div class="a-tab" data-a="wastes">海 墟</div>
      </div>
      <div class="pane" id="paneTeam"></div>
      <div class="pane" id="paneDaily" style="display:none"></div>
      <div class="pane" id="paneDungeon" style="display:none"></div>
      <div class="pane" id="paneAbyss" style="display:none"></div>
      <div class="pane" id="paneWastes" style="display:none"></div>
    </div>
  </div>

  <!-- ====== 视图 3：背包（独立顶层 tab）====== -->
  <div class="view" id="viewBag" style="display:none">
    <div class="col-wrap">
      <div id="paneBag"></div>
    </div>
  </div>

  <!-- ====== 视图 4：商店 ====== -->
  <div class="view" id="viewStorage" style="display:none">
    <div class="col-wrap">
      <div class="side-tabs">
        <div class="b-tab on" data-b="podcast">电 台</div>
        <div class="b-tab" data-b="shop">商 店</div>
      </div>
      <div class="pane" id="panePodcast"></div>
      <!-- #paneShop 内部静态结构由 preact <ShopPanel/> 接管（Stage 6.1b），mount 时清空重建。
           内部 #kSpent/#kLunite/#kDays/#scFeatured/#scRegular/#scTopup/#bannerFeatured 等id
           在 mount 后不复存在，请勿通过 getElementById 查询。 -->
      <div class="pane" id="paneShop" style="display:none">
        <h2 class="col-head" style="margin-top:0">钱 包</h2>
        <div class="shop-bar">
          <div class="sb spent"><div class="l">累计充值</div><div class="v" id="kSpent">¥0</div></div>
          <div class="sb lun"><div class="l">月相库存</div><div class="v" id="kLunite">0</div></div>
          <div class="sb days"><div class="l">月卡剩余</div><div class="v" id="kDays">0</div></div>
        </div>

        <!-- 商店分类 tab -->
        <div class="shop-cat-tabs">
          <button class="sct on" data-sc="featured">特惠专区</button>
          <button class="sct" data-sc="regular">常驻礼包</button>
          <button class="sct" data-sc="topup">凝刻月相</button>
        </div>

        <!-- 特惠专区：月卡 + 战令 + 限购礼包 -->
        <div class="shop-cat" id="scFeatured">
          <div class="shop-banners" id="bannerFeatured"></div>
        </div>

        <!-- 常驻礼包：长期不下架的礼包（暂时也是 bundle 里的，按 period 区分） -->
        <div class="shop-cat" id="scRegular" style="display:none">
          <div class="shop-banners" id="bannerRegular"></div>
        </div>

        <!-- 凝刻月相（直充） -->
        <div class="shop-cat" id="scTopup" style="display:none">
          <div class="shop-banners topup-grid" id="bannerTopup"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 全局 toast -->
  <div class="toast" id="toast"></div>
</div>

<!-- 抽卡动画 -->
<div class="overlay" id="ov">
  <div class="ov-title" id="ovTitle"></div>
  <div class="beam" id="beam"></div>
  <div class="sparks" id="sparks"></div>
  <div class="cards-wrap" id="cards"></div>
</div>
<div class="skip-hint" id="skipHint">点击屏幕翻开所有 · 再次点击关闭</div>

<!-- 角色详情弹窗（外层，独立 mount 节点，避免与子 modal 共用 #modalBox）-->
<div class="modal" id="roleModal">
  <div class="modal-box role-modal" id="roleModalBox"></div>
</div>
<!-- 通用弹窗（子 modal，DOM 在后故层级在上）-->
<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- 战斗界面（全屏覆盖） -->
<div id="battleOverlay" style="display:none;position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);align-items:flex-start;justify-content:center;overflow-y:auto"></div>

<!-- Preact 根挂载点 (Stage 1 起,新 UI 组件挂这里;暂时是空的) -->
<div id="preact-root"></div>

</body>
</html>
